[project]
name = "flagged"
version = "0.1.0"
description = "Do 2025-era AI-text detectors still flag non-native English writers?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "matplotlib>=3.11.2",
    "mlx-lm>=0.32.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "protobuf>=7.36.2",
    "pyarrow>=26.0.0",
    "pyspellchecker>=0.9.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sentencepiece>=0.2.2",
    "statsmodels>=0.15.0",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
    "typst>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flagged"]
